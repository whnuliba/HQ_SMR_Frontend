
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;
   upstream hqsmr-server{
         server  localhost:5003 weight=2;
       }
    server {
        listen       8088;
        server_name  localhost;

        #access_log  logs/host.access.log  main;

        location / {
            root   D:/WCS/hqsmr-frontend;
            index  index.html index.htm;
			try_files $uri $uri/ /index.htm;
        }
		location /api/ {
          if ( $request_uri = "/api" )
	       {
               rewrite "/" http://localhost:8088/ break;
                 }
           proxy_pass	http://hqsmr-server/;
           #Proxy Settings
           proxy_redirect     off;
           proxy_set_header   Host             $host:$server_port;
           proxy_set_header   X-Real-IP        $remote_addr;
           proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
           proxy_set_header   REMOTE-HOST      $remote_addr;
		   proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection "upgrade";
           proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
           proxy_max_temp_file_size 0;
           proxy_connect_timeout      999;
           proxy_send_timeout         999;
           proxy_read_timeout         999;
#          proxy_buffer_size          4k;
#          proxy_buffers              4 32k;
#          proxy_busy_buffers_size    64k;
#          proxy_temp_file_write_size 64k;
           client_max_body_size 100m;
	   client_body_buffer_size 1024k;
          #  proxy_pass   http://10.2.104.84:8085/c-mes-server;
        }
		
	   location /ws/ {
          if ( $request_uri = "/ws" )
	       {
               rewrite "/" http://localhost:8088/ws/ break;
           }
           proxy_pass	http://hqsmr-server/;
           #Proxy Settings
           proxy_redirect     off;
           proxy_set_header   Host             $host:$server_port;
           proxy_set_header   X-Real-IP        $remote_addr;
           proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
           proxy_set_header   REMOTE-HOST      $remote_addr;
		   proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection "upgrade";
           proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
           proxy_max_temp_file_size 0;
           proxy_connect_timeout      999;
           proxy_send_timeout         999;
           proxy_read_timeout         999;
#          proxy_buffer_size          4k;
#          proxy_buffers              4 32k;
#          proxy_busy_buffers_size    64k;
#          proxy_temp_file_write_size 64k;
           client_max_body_size 100m;
	   client_body_buffer_size 1024k;
          #  proxy_pass   http://10.2.104.84:8085/c-mes-server;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }


